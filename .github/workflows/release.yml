name: Release

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86
            runner: ubuntu-latest
            cc: i686-w64-mingw32-gcc
            install: |
              sudo apt-get update
              sudo apt-get install -y gcc-mingw-w64-i686
            output: windows-x86-${{ github.event.repository.name }}.dll
            cflags: -shared -O3 -s

          - name: windows-x64
            runner: ubuntu-latest
            cc: x86_64-w64-mingw32-gcc
            install: |
              sudo apt-get update
              sudo apt-get install -y gcc-mingw-w64-x86-64
            output: windows-x64-${{ github.event.repository.name }}.dll
            cflags: -shared -O3 -s

          - name: linux-x86
            runner: ubuntu-latest
            cc: gcc
            install: |
              sudo dpkg --add-architecture i386
              sudo apt-get update
              sudo apt-get install -y gcc-multilib libc6-dev-i386
            output: linux-x86-${{ github.event.repository.name }}.so
            cflags: -m32 -shared -fPIC -O3 -s

          - name: linux-x64
            runner: ubuntu-latest
            cc: gcc
            install: |
              sudo apt-get update
              sudo apt-get install -y gcc
            output: linux-x64-${{ github.event.repository.name }}.so
            cflags: -m64 -shared -fPIC -O3 -s

    steps:
      - uses: actions/checkout@v4

      - name: Clone ClassiCube
        run: git clone https://github.com/ClassiCube/ClassiCube.git

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Build
        run: |
          ${{ matrix.cc }} \
            ${{ matrix.cflags }} \
            -Isrc \
            src/*.c \
            -o "${{ matrix.output }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.output }}

  macos:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            name: macos-x64
            output: macos-x64-${{ github.event.repository.name }}.dylib

          - arch: arm64
            name: macos-arm64
            output: macos-arm64-${{ github.event.repository.name }}.dylib

    steps:
      - uses: actions/checkout@v4

      - name: Clone ClassiCube
        run: git clone https://github.com/ClassiCube/ClassiCube.git

      - name: Build
        run: |
          clang \
            -dynamiclib -O3 \
            -arch ${{ matrix.arch }} \
            -Isrc \
            src/*.c \
            -o "${{ matrix.output }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.output }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - macos

    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
